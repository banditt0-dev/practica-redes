<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Práctica – Comunicaciones y Redes (selector de unidades)</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5b6478;--bd:#d9deea;--ac:#2e5597;--ok:#1b7f3b;--okb:#e6f5ea;--ko:#b3261e;--kob:#fdeceb}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#9aa4bb;--bd:#2d3550;--ac:#7ea6ee;--ok:#5fd28a;--okb:#16301f;--ko:#ff8a80;--kob:#35191a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:900px;margin:0 auto}
h1{font-size:18px;margin:0 8px 0 0}
select,button{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.score{margin-left:auto;font-weight:600}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;max-width:900px;margin:8px auto 0}.bar>i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
main{max-width:900px;margin:0 auto;padding:16px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.q h3{font-size:16px;margin:0 0 10px}.q h3 span{color:var(--mu);font-weight:500;margin-right:4px}
.o{display:flex;gap:8px;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.o b{min-width:1.3em;color:var(--ac)}
.o:hover:not([disabled]){border-color:var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.ko{background:var(--kob);border-color:var(--ko)}
.o[disabled]{cursor:default;opacity:1;color:var(--tx)}
.fb{margin-top:8px;padding:8px 12px;border-radius:9px;font-size:15px}.fb.ok{background:var(--okb);color:var(--tx);border-left:4px solid var(--ok)}.fb.ko{background:var(--kob);border-left:4px solid var(--ko)}
.fb b.t{display:block}.fb.ok b.t{color:var(--ok)}.fb.ko b.t{color:var(--ko)}
.res{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.mu{color:var(--mu);font-size:14px}.hide{display:none}
.cd{background:rgba(127,127,127,.15);padding:8px 10px;border-radius:6px;font:13px/1.45 Consolas,monospace;white-space:pre-wrap;margin:6px 0;display:block;font-weight:400}.q h3{white-space:pre-wrap}.o span{white-space:pre-wrap}
#selbox{max-width:900px;margin:12px auto 0;padding:0 16px}#selbox details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px}#selbox summary{cursor:pointer;font-weight:600}
#chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px 16px;margin-top:10px}.chk{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}.chk input{width:18px;height:18px;flex:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}input[type=number]{width:80px;font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
</style></head><body>
<header><div class="row"><h1>Práctica de Redes · selector</h1>
<select id="mode" aria-label="Modo"></select>

<span class="score" id="score"></span></div><div class="bar"><i id="pb"></i></div></header>
<div id="selbox" class="hide"><details id="seld" open><summary>Elegí las unidades</summary>
<div id="chks"></div>

<div class="ctl"><label for="sN">Cantidad de preguntas:</label><input type="number" id="sN" min="1" value="30"><button id="sMax">Usar todas</button><button class="pri" id="sGo">Empezar (al azar)</button></div>
</details></div>
<main id="main"></main>
<script>
const DATA={"I": {"title": "IOS: modos, contraseñas y configuración básica", "qs": [["Un técnico escribe estos comandos en un router:\n```\nRouter> enable\nRouter# configure terminal\nRouter(config)# interface fastEthernet 0/0\n```\n¿Cómo queda el prompt después del último comando?", "Router(config-if)#", "Router(config)#", "Router#", "Router(config-line)#", "Al entrar a una interfaz se pasa al modo de configuración de interfaz."], ["¿Qué modo de IOS indica el prompt Router> y qué se puede hacer en él?", "Modo EXEC de usuario: solo comandos de monitoreo limitados, sin cambiar la configuración.", "Modo EXEC privilegiado: ver y guardar toda la configuración.", "Modo de configuración global: cambiar parámetros del equipo.", "Modo ROMMON: recuperar el equipo cuando falla el IOS.", "Con enable se pasa al modo privilegiado, cuyo prompt es Router#."], ["¿Qué comando protege el modo EXEC privilegiado con una contraseña que se guarda cifrada?", "enable secret fcytcyr", "enable password fcytcyr", "line console 0 secret fcytcyr", "service enable fcytcyr", "enable password queda en texto plano en la configuración, salvo que se use service password-encryption."], ["Un administrador quiere pedir contraseña al conectarse por la consola. ¿Qué secuencia es la correcta?", "line con 0\npassword conredes\nlogin", "line vty 0 4\npassword conredes\nlogin", "interface console 0\npassword conredes\nlogin", "line con 0\npassword conredes\nno login", "Sin el comando login, la línea no pide contraseña. Las líneas vty 0 4 son los accesos remotos."], ["Se configuró line vty 0 4 con password conredes y login. ¿Para qué sirve esa configuración?", "Para pedir contraseña a las conexiones remotas (Telnet) al equipo.", "Para pedir contraseña al conectarse por el puerto de consola.", "Para proteger el modo EXEC privilegiado.", "Para cifrar todas las contraseñas del equipo.", "Las líneas vty 0 4 permiten cinco sesiones remotas simultáneas."], ["En la configuración de un router se ven las líneas enable password fcytcyr y line con 0 / password conredes. ¿Qué hace el comando service password-encryption?", "Cifra las contraseñas en texto plano que aparecen en la configuración.", "Cifra el tráfico que circula por el router.", "Protege el acceso al modo de configuración global.", "Impide que se muestren las contraseñas con show startup-config.", "No cifra el tráfico: solo oculta las contraseñas guardadas en el archivo de configuración."], ["¿Qué hace este comando?\n```\nRouter(config)# banner motd #Solo acceso autorizado#\n```", "Muestra el mensaje del día a todos los que se conecten al equipo.", "Cambia el nombre del equipo a “Solo acceso autorizado”.", "Bloquea el acceso a quien no conozca la contraseña.", "Guarda un mensaje en la memoria NVRAM sin mostrarlo.", "El carácter # es el delimitador del mensaje."], ["¿Qué comando guarda la configuración activa para que no se pierda al reiniciar?", "copy running-config startup-config", "copy startup-config running-config", "write erase", "reload save", "La running-config está en RAM y la startup-config en NVRAM."], ["Se configuró el router pero se olvidó guardar la configuración y se cortó la luz. ¿Qué pasa al reiniciar?", "Se pierden los cambios hechos desde el último guardado, porque la running-config está en RAM.", "Se conservan todos los cambios, porque se guardan solos en NVRAM.", "Se pierden también las contraseñas guardadas en NVRAM.", "El router queda sin sistema operativo.", "El archivo de arranque es la startup-config."], ["¿Qué muestra el comando show running-config?", "La configuración activa del equipo, almacenada en RAM.", "La configuración guardada para el próximo arranque.", "La versión de IOS y el tiempo de funcionamiento.", "El estado resumido de las interfaces.", "show startup-config muestra la configuración guardada en NVRAM."], ["Se escribe un comando y el IOS responde: % Incomplete command. ¿Qué significa?", "Faltan palabras clave o argumentos en el comando.", "El comando está mal escrito.", "El comando no se puede usar en el modo actual.", "Hay varios comandos que empiezan igual y no alcanza.", "Con ? se pueden ver las opciones que faltan."], ["El IOS responde % Invalid input detected at '^' marker. ¿Qué hay que revisar?", "El comando o parámetro mal escrito en la posición que marca el ^.", "Que la interfaz esté con no shutdown.", "Que haya una contraseña configurada.", "Que la configuración esté guardada en NVRAM.", "El marcador ^ señala hasta dónde llegó a interpretar el comando."], ["¿Qué efecto tiene la tecla Tab al escribir un comando en la CLI?", "Completa el comando si lo escrito alcanza para identificarlo.", "Muestra la lista de comandos disponibles.", "Repite el último comando.", "Sale al modo EXEC privilegiado.", "Ctrl+Z vuelve al modo EXEC privilegiado; el signo ? muestra ayuda."], ["¿Cuál es la secuencia que activa una interfaz y le asigna una dirección?", "interface fastEthernet 0/0\nip address 192.168.1.1 255.255.255.0\nno shutdown", "interface fastEthernet 0/0\nip address 192.168.1.1/24\nshutdown", "interface fastEthernet 0/0\nip address 192.168.1.1 0.0.0.255\nno shutdown", "interface fastEthernet 0/0\nip add 192.168.1.1\nenable", "Las interfaces del router están apagadas por defecto: hace falta no shutdown."], ["¿Qué comando muestra un resumen del estado y la dirección IP de todas las interfaces?", "show ip interface brief", "show interfaces status", "show ip route", "show running-config interface", "Muestra, por interfaz, la IP y el estado (up/down) de la capa física y de enlace."], ["¿Para qué sirve el comando description en una interfaz?", "Para dejar un texto informativo que identifica el enlace, sin cambiar su funcionamiento.", "Para asignar el nombre de host a la interfaz.", "Para identificar el tipo de cable conectado.", "Para habilitar el protocolo CDP en la interfaz.", "Ejemplo del material: description Enlace \"E1\"."], ["¿Cómo se borra la configuración guardada y se vuelve a un equipo “de fábrica”?", "erase startup-config y luego reload", "delete running-config y luego reload", "copy startup-config running-config", "erase flash y luego enable", "Hay que reiniciar para que el equipo arranque sin configuración."]]}, "II": {"title": "Capa física: cables, velocidades y cálculos", "qs": [["Se quiere conectar una PC con un switch usando UTP. ¿Qué cable corresponde?", "Directo: ambos extremos con la misma norma (T568A–T568A o T568B–T568B).", "Cruzado: un extremo T568A y el otro T568B.", "Consola (rollover), porque conecta un host con un dispositivo de red.", "Fibra monomodo, porque conecta dispositivos de capas distintas.", "El cruzado se usa para dispositivos iguales: host con host, switch con switch, router con router."], ["¿Qué cable corresponde para conectar un switch con otro switch por puertos Ethernet comunes?", "Cruzado.", "Directo.", "Consola.", "Coaxial.", "Un extremo en T568A y el otro en T568B."], ["¿Qué cable se usa para conectar el puerto Fast Ethernet de un router con un switch?", "Directo.", "Cruzado.", "Serial V.35.", "Rollover.", "Router y switch son dispositivos de distinto tipo: se usa cable directo."], ["¿Qué cable corresponde para conectar dos PC entre sí, sin switch?", "Cruzado.", "Directo.", "De consola.", "De fibra multimodo.", "Un extremo en T568A y el otro en T568B."], ["¿Cuál es la longitud máxima de un segmento de UTP para Ethernet, según el material?", "100 metros.", "50 metros.", "185 metros.", "500 metros.", "Más allá hay que usar repetidores, switches o fibra."], ["Una conexión tiene throughput de 60 Mbps y goodput de 40 Mbps. ¿Qué mide el goodput?", "Los datos utilizables transferidos, sin encabezados ni sobrecarga de protocolo.", "Todos los bits transferidos por el medio, incluidos los encabezados.", "La capacidad máxima teórica del medio.", "La velocidad del enlace más lento de la ruta.", "El throughput nunca supera el ancho de banda del enlace más lento (cuello de botella)."], ["Con un goodput de 40 Mbps, ¿cuánto tarda en transferirse un archivo de 500 MB (1 MB = 8 Mbit)?", "100 segundos", "12,5 segundos", "50 segundos", "200 segundos", "500 MB = 4000 Mbit; 4000 / 40 = 100 s."], ["Un enlace de 100 Mbps transfiere un archivo de 1,2 GB sin sobrecarga (1 GB = 8000 Mbit). ¿Cuánto tarda?", "96 segundos", "12 segundos", "120 segundos", "9,6 segundos", "1,2 GB = 9600 Mbit; 9600 / 100 = 96 s."], ["Un enlace opera a 2400 baudios con 4 bits por símbolo. ¿Cuál es su tasa de bits?", "9600 bps", "2400 bps", "4800 bps", "600 bps", "Tasa de bits = baudios × bits por símbolo = 2400 × 4."], ["Una señal usa 16 niveles distintos por símbolo y 1000 baudios. ¿Cuál es la tasa de bits?", "4000 bps", "16.000 bps", "1000 bps", "8000 bps", "16 niveles = 4 bits por símbolo (2⁴ = 16); 1000 × 4."], ["¿Cuántos bits por símbolo se necesitan para distinguir 8 niveles de señal?", "3", "2", "4", "8", "2³ = 8."], ["Se pasa de 2,5 Gbps a bits por segundo. ¿Cuál es el valor correcto?", "2.500.000.000 bps", "2.500.000 bps", "25.000.000.000 bps", "250.000.000 bps", "1 Gbps = 10⁹ bps."], ["¿Por qué se trenzan los pares de un cable UTP?", "Para reducir la interferencia electromagnética y la diafonía entre pares.", "Para aumentar la longitud máxima del cable.", "Para permitir conectores más pequeños.", "Para que el cable resista tirones.", "Cuanto más trenzado, mejor se cancela la interferencia."], ["¿Qué estándar WiFi opera en 5 GHz con hasta 54 Mbps y no es interoperable con 802.11b/g?", "802.11a", "802.11b", "802.11g", "802.11n", "Usa frecuencias altas: menor cobertura y peor penetración en edificios."], ["¿Qué estándar WiFi opera en 2,4 GHz con hasta 11 Mbps?", "802.11b", "802.11a", "802.11g", "802.11n", "802.11g alcanza 54 Mbps en 2,4 GHz."], ["La separación entre satélites GEO es de 2 grados sobre el arco ecuatorial. ¿Cuántos satélites GEO caben como máximo?", "180", "360", "90", "720", "360° / 2° = 180."]]}, "III": {"title": "SSH y red inalámbrica: configuración", "qs": [["¿Cuál es el orden correcto de los pasos para habilitar SSH en un switch, según el apunte?", "Verificar compatibilidad, configurar dominio IP, generar claves RSA, crear usuario, configurar líneas vty y habilitar la versión 2.", "Generar claves RSA, verificar compatibilidad, crear usuario, configurar dominio IP y habilitar Telnet.", "Crear usuario, habilitar la versión 2, generar claves RSA y configurar dominio IP.", "Configurar líneas vty, crear la VLAN de administración, generar claves y verificar compatibilidad.", "Antes de configurar SSH, el switch debe tener un nombre de host único y conectividad de red."], ["¿Qué comando verifica que el IOS del switch admita SSH?", "show ip ssh", "show ssh version", "show crypto key", "show running-config ssh", "Si el IOS no admite funciones criptográficas, el comando no se reconoce."], ["Un administrador intenta generar las claves RSA y recibe un error por falta de dominio. ¿Qué comando faltaba antes?", "ip domain-name red.com", "hostname red.com", "crypto domain red.com", "ip name-server red.com", "La clave RSA se genera a partir del nombre de host y del dominio IP."], ["¿Qué comando genera el par de claves RSA y con ello habilita el servidor SSH?", "crypto key generate rsa", "ssh generate key rsa", "ip ssh rsa generate", "crypto key zeroize rsa", "zeroize elimina las claves y deshabilita el servidor SSH."], ["¿Qué tamaño de módulo mínimo recomienda Cisco para las claves RSA?", "1024 bits", "256 bits", "512 bits", "4096 bits", "Un módulo mayor es más seguro, pero tarda más en generarse y usarse."], ["¿Qué hace el comando crypto key zeroize rsa?", "Elimina el par de claves RSA y deshabilita automáticamente el servidor SSH.", "Genera un par de claves nuevo con módulo cero.", "Reinicia el servidor SSH sin borrar las claves.", "Borra el usuario y la contraseña locales.", "Es el procedimiento inverso a crypto key generate rsa."], ["Se configuró un usuario local con este comando:\n```\nusername admin secret ccna\n```\n¿Qué método de autenticación usa luego SSH?", "Local: la base de usuarios del propio dispositivo.", "Un servidor RADIUS o TACACS+ externo.", "La contraseña de la consola.", "La contraseña de enable secret.", "Para usar la base local en las vty se necesita login local."], ["¿Qué configuración deja las líneas vty aceptando solo SSH y autenticando con la base local?", "line vty 0 15\nlogin local\ntransport input ssh", "line vty 0 4\nlogin\ntransport input telnet", "line con 0\nlogin local\ntransport input ssh", "line vty 0 15\nno login\ntransport output ssh", "El Catalyst 2960 tiene líneas vty de 0 a 15."], ["¿Para qué sirve transport input ssh en las líneas vty?", "Para impedir conexiones que no sean SSH, como Telnet.", "Para que el switch acepte Telnet y SSH por igual.", "Para cifrar la contraseña de la consola.", "Para habilitar el servidor SSH sin generar claves.", "Sin esa línea, las vty aceptan por defecto cualquier protocolo."], ["¿Por qué conviene ejecutar ip ssh version 2?", "Porque la versión 1 tiene fallas de seguridad conocidas y por defecto se admiten las dos versiones.", "Porque la versión 2 es la única que admite autenticación local.", "Porque la versión 1 no funciona en switches Catalyst.", "Porque la versión 2 no necesita claves RSA.", "Cuando se admiten ambas, show ip ssh informa la versión 1.99."], ["En la salida de show ip ssh aparece SSH Enabled - version 1.99. ¿Qué significa?", "Se aceptan conexiones SSH versión 1 y 2.", "Solo se acepta la versión 1.99, una versión intermedia.", "Solo se acepta la versión 2.", "SSH está deshabilitado.", "Se recomienda habilitar únicamente la versión 2."], ["Un switch tiene la SVI de la VLAN 99 con IP 172.17.99.11 y SSH habilitado. ¿A qué dirección debe conectarse el cliente SSH (por ejemplo PuTTY)?", "A 172.17.99.11, la IP de la SVI del switch.", "A la dirección MAC del switch.", "A la IP del gateway del router.", "A la IP de la PC cliente.", "Luego se piden usuario y contraseña."], ["Un switch recibe esta configuración:\n```\ninterface Vlan1\nip address 192.168.10.2 255.255.255.0\nno shutdown\nip default-gateway 192.168.10.1\n```\n¿Para qué sirve ip default-gateway?", "Para que el switch pueda comunicarse con redes distintas a la suya (administración remota).", "Para que los hosts conectados usen al switch como gateway.", "Para que el switch enrute entre VLAN.", "Para asignar la VLAN de acceso a los puertos.", "Un switch de capa 2 no enruta: necesita un gateway para responder a otras redes."], ["Se debe cambiar la seguridad de un router WiFi para una red doméstica. ¿Qué combinación del material es correcta?", "WPA2-Personal con cifrado AES y una clave compartida.", "WEP con cifrado AES.", "WPA2-Personal sin cifrado.", "Red abierta con filtrado por SSID.", "En la práctica integradora se usó WPA2-Personal, AES y la clave Redes2020."], ["En el router WiFi se cambia el nombre de la red a LanPna. ¿Qué parámetro se modificó?", "El SSID, el nombre con el que se anuncia la red inalámbrica.", "El canal de la red inalámbrica.", "El modo de seguridad del router.", "El nombre de host del router.", "Se cambia en la pestaña Wireless."], ["Un router WiFi tiene LAN 192.168.0.1/24 y se quiere que el DHCP entregue sólo 11 direcciones, de 192.168.0.100 a 192.168.0.110. ¿Qué hay que configurar?", "La dirección inicial 192.168.0.100 y un máximo de 11 usuarios.", "La dirección inicial 192.168.0.110 y un máximo de 100 usuarios.", "La dirección inicial 192.168.0.1 y un máximo de 110 usuarios.", "La dirección inicial 192.168.0.100 y un máximo de 10 usuarios.", "Entre .100 y .110 inclusive hay 11 direcciones."], ["¿Por qué es importante cambiar la contraseña de administración por defecto (admin/admin) del router WiFi?", "Porque cualquiera que conozca los valores de fábrica podría reconfigurar el router.", "Porque la contraseña por defecto impide la conexión de la notebook.", "Porque el cifrado AES lo exige para funcionar.", "Porque el DHCP no se activa con la clave original.", "Es una medida básica de seguridad."]]}, "IV": {"title": "Capa de enlace: PPP, CRC, tramas y MAC", "qs": [["Dos routers, RCapital y RCentral, se conectan por un enlace serial con PPP y CHAP. ¿Cuál es la configuración correcta en RCapital?", "username RCentral password redes\ninterface Serial0/0/0\nencapsulation ppp\nppp authentication chap", "username RCapital password redes\ninterface Serial0/0/0\nencapsulation ppp\nppp authentication chap", "username RCentral password redes\ninterface Serial0/0/0\nencapsulation hdlc\nppp authentication chap", "username RCentral password redes\ninterface Serial0/0/0\nencapsulation ppp\nppp authentication pap", "El usuario que se crea es el nombre del router vecino; ambos extremos comparten la misma contraseña."], ["En PPP con CHAP, RCentral tiene username RCapital password redes y RCapital tiene username RCentral password clave. ¿Qué ocurre?", "La autenticación falla: la contraseña debe ser la misma en ambos extremos.", "Funciona, porque cada router usa su propia contraseña.", "Funciona, pero solo en un sentido.", "Se pasa a HDLC automáticamente.", "CHAP compara el resultado de un hash calculado con la contraseña compartida."], ["Un enlace PPP con PAP entre RDMZ y RCentral usa estas líneas en RDMZ:\n```\nencapsulation ppp\nppp authentication pap\nppp pap sent-username RDMZ password redes\n```\n¿Para qué sirve la última línea?", "Para enviar al otro extremo el usuario y la contraseña con que se identifica.", "Para exigir que el otro extremo use CHAP.", "Para crear el usuario local con que el otro se autentica.", "Para fijar el nombre de host de RDMZ.", "PAP envía el usuario y la contraseña sin cifrar; en la práctica ambos extremos deben tener los dos comandos."], ["¿Cuál es la diferencia principal entre PAP y CHAP?", "PAP envía usuario y contraseña en texto plano; CHAP usa un desafío con hash y no envía la contraseña.", "PAP usa desafío con hash; CHAP envía la contraseña en texto plano.", "PAP autentica solo en un extremo; CHAP no autentica.", "PAP es de capa 3; CHAP es de capa 2.", "CHAP puede repetir el desafío en forma periódica."], ["¿Qué encapsulación usa por defecto una interfaz serial de un router Cisco?", "HDLC", "PPP", "Frame Relay", "Ethernet", "Para usar PPP hay que configurarlo con encapsulation ppp."], ["Un enlace serial tiene encapsulación HDLC en un extremo y PPP en el otro. ¿Qué sucede?", "El enlace no levanta a nivel de capa 2 (protocolo de línea down).", "Se negocia PPP automáticamente.", "Funciona, pero sin autenticación.", "Funciona, pero solo en half-duplex.", "Ambos extremos deben usar la misma encapsulación."], ["En un enlace serial, ¿en qué extremo hay que configurar el comando clock rate 64000?", "En el extremo DCE, el que provee la señal de reloj.", "En el extremo DTE.", "En ambos extremos.", "En el switch conectado.", "El cable DCE se identifica porque aporta el reloj."], ["¿Qué comando permite ver si PPP se estableció en un enlace serial?", "show interfaces serial 0/0/0", "show ip protocols", "show vlan brief", "show mac-address-table", "Si todo está bien, informa Encapsulation PPP y LCP Open."], ["¿Cuál es el valor correcto del bit de paridad par para el dato 1011001?", "0", "1", "10", "No se puede calcular.", "El dato tiene cuatro 1; con paridad par el total debe ser par."], ["¿Cuál es el bit de paridad impar para el dato 1011001?", "1", "0", "11", "No se puede calcular.", "Con cuatro 1, la paridad impar necesita un 1 más."], ["Se transmite el mensaje 1101011011 con el polinomio generador 10011 (x⁴ + x + 1). ¿Cuál es el residuo (los 4 bits de CRC)?", "1110", "0110", "1011", "0111", "La trama transmitida es 11010110111110."], ["Se calcula el CRC de 11100110 con el generador 1011. ¿Cuál es el residuo?", "100", "011", "110", "001", "Se divide módulo 2: la resta es un XOR."], ["Un receptor divide la trama recibida (datos + CRC) por el mismo polinomio generador y obtiene residuo distinto de cero. ¿Qué concluye?", "Hubo un error de transmisión y la trama se descarta.", "La trama llegó correcta.", "Falta una dirección MAC.", "El generador es incorrecto y hay que cambiarlo.", "El residuo cero indica que no se detectaron errores."], ["Un protocolo con bandera 01111110 aplica relleno de bits: tras cinco 1 consecutivos inserta un 0. ¿Cómo viaja el dato 0111111011111?", "011111010111110", "0111110101111100", "0111111011111", "0111110111111", "El relleno evita confundir datos con la bandera."], ["Una dirección MAC de destino es 01-00-5E-00-00-05. ¿De qué tipo es?", "Multicast: el bit menos significativo del primer byte es 1.", "Unicast: el primer byte es par.", "Broadcast: tiene el OUI 01-00-5E.", "Pertenece al fabricante 5E.", "Broadcast es FF-FF-FF-FF-FF-FF."], ["De la MAC 00-0C-29-6A-A1-3C, ¿qué parte identifica al fabricante?", "00-0C-29 (OUI, los primeros 3 bytes).", "6A-A1-3C (los últimos 3 bytes).", "0C-29-6A (los bytes centrales).", "3C (el último byte).", "Los 3 últimos bytes los asigna el fabricante como número exclusivo."], ["¿Qué comando de Windows muestra la dirección MAC de las placas de red?", "ipconfig /all", "ipconfig /displaydns", "netstat -an", "nslookup", "También sirve getmac."], ["¿Qué función cumple el campo FCS de una trama Ethernet?", "Detectar errores mediante un CRC calculado por el emisor y recalculado por el receptor.", "Indicar el protocolo de capa 3 transportado.", "Delimitar el inicio de la trama.", "Identificar la VLAN de la trama.", "Si los valores no coinciden, la trama se descarta."]]}, "V": {"title": "Acceso al medio: ALOHA, CSMA/CD y conmutación", "qs": [["En ALOHA puro la fórmula del rendimiento es S = G·e^(−2G). ¿Cuál es el rendimiento con G = 0,5 (el máximo del sistema)?", "Aproximadamente 0,184 (18 %).", "Aproximadamente 0,368 (37 %).", "Aproximadamente 0,135 (14 %).", "Aproximadamente 0,5 (50 %).", "0,5 × e⁻¹ ≈ 0,184. El material indica un uso máximo del canal del 18 %."], ["En ALOHA ranurado S = G·e^(−G). ¿Cuál es el rendimiento con G = 1?", "Aproximadamente 0,368 (el doble que en ALOHA puro).", "Aproximadamente 0,184.", "Aproximadamente 0,135.", "Aproximadamente 1,0 (100 %).", "Se obtiene el doble de eficiencia que en ALOHA puro."], ["En ALOHA puro con G = 1, ¿cuál es el rendimiento S?", "Aproximadamente 0,135 (13,5 %).", "Aproximadamente 0,368.", "Aproximadamente 0,184.", "Aproximadamente 0,5.", "S = 1 × e⁻² ≈ 0,135: con más carga que la óptima el rendimiento baja."], ["En ALOHA ranurado con G = 2, ¿cuál es el rendimiento S?", "Aproximadamente 0,271 (27 %).", "Aproximadamente 0,368.", "Aproximadamente 0,135.", "Aproximadamente 0,5.", "S = 2 × e⁻² ≈ 0,271."], ["En ALOHA ranurado, ¿cuándo puede transmitir una estación?", "Solo al comienzo de la siguiente ranura de tiempo.", "En cualquier instante.", "Solo cuando recibe un token.", "Solo cuando escucha el canal libre por 96 bits.", "El ALOHA continuo pasa a ser discreto."], ["¿Qué distingue a CSMA/CD de ALOHA?", "La estación escucha el canal antes de transmitir y detecta colisiones mientras transmite.", "La estación transmite sin escuchar y espera la confirmación.", "La estación reserva ranuras con un mapa de bits.", "La estación espera un token para transmitir.", "Es la base de Ethernet."], ["¿A cuánto equivale el tiempo de ranura de Ethernet (512 tiempos de bit) en una red de 10 Mbps?", "51,2 µs", "5,12 µs", "512 µs", "9,6 µs", "512 bits / 10.000.000 bps = 51,2 µs."], ["¿Cuánto dura el espacio entre tramas (96 tiempos de bit) en una red de 100 Mbps?", "0,96 µs", "9,6 µs", "96 µs", "0,096 µs", "96 / 100.000.000 = 0,96 µs. A 10 Mbps son 9,6 µs."], ["Con el retroceso exponencial binario de Ethernet, tras la tercera colisión consecutiva una estación espera un número de ranuras elegido al azar entre:", "0 y 7", "0 y 3", "1 y 8", "0 y 15", "Tras i colisiones se elige entre 0 y 2^i − 1; con i = 3 son 8 valores."], ["Con el retroceso exponencial binario, tras la primera colisión, la estación espera:", "0 o 1 ranuras, al azar.", "0 a 3 ranuras, al azar.", "Siempre 1 ranura.", "Un tiempo fijo de 51,2 µs.", "2¹ − 1 = 1: hay dos valores posibles."], ["Una trama Ethernet con campo de datos de 46 bytes, ¿cuántos bytes tiene en total (sin preámbulo)?", "64 bytes", "46 bytes", "60 bytes", "72 bytes", "6 + 6 + 2 + 46 + 4 = 64: es el tamaño mínimo."], ["Una trama tiene 40 bytes de datos. ¿Qué hace la capa MAC de Ethernet?", "Agrega relleno hasta completar 46 bytes de datos (64 bytes de trama).", "La descarta por ser demasiado corta.", "La envía igual sin modificarla.", "Agrega 6 bytes de preámbulo adicional.", "Tamaño mínimo de trama: 64 bytes."], ["Una trama de 40 bytes llega a un receptor como fragmento de colisión (runt). ¿Qué se hace con ella?", "Se descarta, porque es menor que el tamaño mínimo.", "Se procesa normalmente.", "Se reenvía al emisor.", "Se entrega a la capa de red con relleno.", "La longitud mínima asegura que la colisión se detecte antes de terminar de transmitir."], ["Un switch recibe en el puerto 1 una trama de A hacia B, y B es desconocido. ¿Qué hace?", "Aprende que A está en el puerto 1 y envía la trama por todos los demás puertos.", "Descarta la trama.", "La envía solo por el puerto 1.", "La envía solo por el puerto con la dirección más baja.", "Se llama inundación; luego B responde y el switch aprende su puerto."], ["La tabla MAC de un switch es:\n```\nA - puerto 1\nB - puerto 2\n```\nLlega por el puerto 2 una trama de B con destino A. ¿Qué hace el switch?", "La envía solo por el puerto 1.", "La envía por todos los puertos excepto el 2.", "La descarta, porque llegó por el puerto 2.", "La envía por el puerto 2.", "Reenvío selectivo: el destino está en la tabla."], ["La tabla MAC es:\n```\nA - puerto 1\nB - puerto 1\n```\nLlega por el puerto 1 una trama de A con destino B. ¿Qué hace el switch?", "La filtra (no la reenvía), porque origen y destino están en el mismo puerto.", "La envía por todos los puertos.", "La envía por el puerto 1 de vuelta.", "La envía solo por el puerto 2.", "Al estar en el mismo segmento, el destino ya recibió la trama."], ["Un switch de 8 puertos con un host en cada puerto, ¿cuántos dominios de colisión y cuántos de broadcast forma (sin VLAN)?", "8 dominios de colisión y 1 de broadcast.", "1 dominio de colisión y 8 de broadcast.", "8 de colisión y 8 de broadcast.", "1 de colisión y 1 de broadcast.", "Cada puerto del switch es un dominio de colisión independiente."], ["Un hub de 8 puertos con un host en cada puerto, ¿cuántos dominios de colisión forma?", "1", "8", "2", "4", "El hub repite la señal por todos los puertos: es un medio compartido."], ["En una red WiFi, la estación A transmite a B, y C está fuera del alcance de A pero dentro del de B. C cree que el canal está libre y transmite. ¿Cómo se llama este problema y cómo lo reduce MACA?", "Estación oculta; con RTS/CTS las estaciones cercanas al receptor se enteran y esperan.", "Estación expuesta; con RTS/CTS las estaciones transmiten sin escuchar.", "Colisión tardía; con un mapa de bits que reserva ranuras.", "Fragmento de colisión; con relleno de la trama.", "A envía RTS a B y B responde CTS."]]}, "VI": {"title": "Ethernet y configuración de routers y switches", "qs": [["¿Cuál es la longitud mínima y máxima de una trama Ethernet (desde la MAC destino hasta la FCS)?", "64 y 1518 bytes.", "46 y 1500 bytes.", "64 y 1500 bytes.", "72 y 1526 bytes.", "Con el preámbulo de 8 bytes serían 72 y 1526."], ["¿Cuál es el orden de los campos de una trama Ethernet II?", "MAC destino, MAC origen, tipo, datos, FCS.", "MAC origen, MAC destino, tipo, datos, FCS.", "MAC destino, tipo, MAC origen, datos, FCS.", "Tipo, MAC destino, MAC origen, datos, FCS.", "El campo Tipo identifica el protocolo de capa superior (por ejemplo 0x0800 para IPv4)."], ["Una PC envía un broadcast Ethernet. ¿Qué dirección MAC de destino lleva la trama?", "FF-FF-FF-FF-FF-FF", "00-00-00-00-00-00", "01-00-5E-00-00-01", "FF-00-00-00-00-00", "Son 48 bits en 1."], ["Se conecta un switch con otro y se configuran los puertos a 100 Mbps full-duplex. ¿Qué ventaja tiene full-duplex?", "No hay colisiones: se puede transmitir y recibir al mismo tiempo.", "Se usa CSMA/CD con menor retardo.", "Se pueden conectar más hosts por segmento.", "La trama mínima baja a 46 bytes.", "En half-duplex el medio se comparte y se usa CSMA/CD."], ["Un router tiene esta configuración y la LAN no responde. ¿Qué falta?\n```\ninterface FastEthernet0/0\nip address 192.168.0.1 255.255.255.0\n```", "no shutdown", "clock rate 64000", "encapsulation ppp", "ip route 0.0.0.0 0.0.0.0", "Las interfaces del router están apagadas por defecto."], ["En la solución del práctico, RCentral tiene estas rutas:\n```\nip route 0.0.0.0 0.0.0.0 Serial0/0/0\nip route 192.168.99.0 255.255.255.0 Serial0/1/0\n```\n¿Qué indican?", "El tráfico a la red 192.168.99.0 sale por Serial0/1/0 y todo lo demás por Serial0/0/0.", "Todo el tráfico sale por Serial0/1/0 excepto 192.168.99.0.", "La red 192.168.99.0 está conectada directamente a Serial0/0/0.", "La ruta 0.0.0.0 solo se usa si falla la ruta a 192.168.99.0.", "Se usa la ruta más específica; la 0.0.0.0/0 se usa cuando no hay otra coincidencia."], ["En la práctica, RCentral tiene en su enlace E2 la IP 10.10.0.1/30 y RDMZ tiene en su serial 10.40.0.1/30. ¿Qué problema hay?", "Las interfaces están en subredes distintas y no pueden comunicarse directamente.", "Falta clock rate en RCentral.", "El prefijo /30 no admite dos hosts.", "Las IP están duplicadas.", "Los dos extremos de un enlace punto a punto deben pertenecer a la misma red /30."], ["Un enlace punto a punto usa la red 10.20.0.0/30. ¿Qué direcciones usan los dos routers?", "10.20.0.1 y 10.20.0.2", "10.20.0.0 y 10.20.0.1", "10.20.0.2 y 10.20.0.3", "10.20.0.1 y 10.20.0.3", "10.20.0.0 es la red y 10.20.0.3 el broadcast."], ["Un switch de acceso tiene esta configuración:\n```\ninterface Vlan1\nip address 192.168.10.2 255.255.255.0\nno shutdown\nip default-gateway 192.168.10.1\n```\n¿Para qué sirve la dirección 192.168.10.2?", "Para administrar el switch de forma remota; no es necesaria para reenviar tramas.", "Para que los hosts la usen como gateway.", "Para enrutar entre VLAN.", "Para asignar direcciones a los hosts por DHCP.", "El switch de capa 2 reenvía por MAC, sin usar su IP."], ["En la configuración de un router aparece line vty 0 4 / password conredes / login. Un usuario intenta conectarse por Telnet. ¿Qué ocurre?", "Se le pide la contraseña conredes.", "Entra directamente al modo privilegiado.", "La conexión se rechaza, porque Telnet no está soportado.", "Se le pide el nombre de usuario local.", "Sin login configurado no se pediría contraseña."], ["¿Para qué sirve el comando service password-encryption en una configuración con contraseñas password conredes?", "Para que las contraseñas no se vean en texto plano en show running-config.", "Para cifrar las conexiones Telnet.", "Para impedir el acceso por consola.", "Para generar claves RSA.", "Es un cifrado débil, pensado para evitar lecturas casuales."], ["En la práctica de repaso, FCyT-R1 y FCyT-R2 configuran PPP con CHAP:\n```\nR1: username FCyT-R2 password redes\nR2: username FCyT-R1 password redes\n```\n¿Por qué cada router define el nombre del otro?", "Porque el usuario es el nombre de host del vecino y se verifica contra el nombre que este envía.", "Porque CHAP exige nombres de usuario distintos al nombre del host.", "Porque cada router debe autenticarse a sí mismo.", "Porque el nombre del vecino se usa como contraseña.", "CHAP usa el hostname del otro extremo para buscar la contraseña compartida."], ["¿Qué diferencia hay entre enable password y enable secret?", "enable secret guarda la contraseña con hash; enable password la guarda en texto plano (salvo service password-encryption).", "enable secret solo vale para la consola; enable password vale para vty.", "enable password tiene prioridad sobre enable secret.", "enable secret es de capa 3 y enable password de capa 2.", "Si ambos están configurados, se usa enable secret."], ["Un router tiene en su serial el comando clock rate 64000 y el enlace no levanta. ¿Qué hay que revisar?", "Que el cable DCE esté conectado a esa interfaz y que el otro extremo tenga la misma encapsulación.", "Que el switch tenga VLAN 1 activa.", "Que la LAN tenga una ruta por defecto.", "Que el router tenga un SSID configurado.", "clock rate solo se acepta en la interfaz DCE."], ["La tabla MAC de un switch está vacía al iniciar. ¿Cómo se completa?", "Aprende la MAC de origen de cada trama recibida y la asocia al puerto de entrada.", "La carga el administrador manualmente.", "La obtiene de un servidor DHCP.", "La obtiene con ping a cada host.", "Si el destino es desconocido, inunda la trama por todos los puertos excepto el de entrada."]]}, "VII": {"title": "Enrutamiento estático, tabla de rutas y RIP", "qs": [["R1 debe llegar a la red 172.16.2.0/24 a través del vecino 172.16.4.2. ¿Qué comando es correcto?", "ip route 172.16.2.0 255.255.255.0 172.16.4.2", "ip route 172.16.4.2 255.255.255.0 172.16.2.0", "ip route 172.16.2.0 0.0.0.255 172.16.4.2", "ip route 172.16.2.0/24 172.16.4.2", "Se indican red, máscara y siguiente salto (o interfaz de salida)."], ["¿Qué hace este comando?\n```\nip route 0.0.0.0 0.0.0.0 Serial0/0/1\n```", "Crea una ruta por defecto: todo paquete sin ruta específica sale por Serial0/0/1.", "Elimina todas las rutas del router.", "Bloquea el tráfico de la interfaz Serial0/0/1.", "Habilita RIP en la interfaz Serial0/0/1.", "Es lo típico de un router cliente que sale hacia su ISP."], ["En la solución de la práctica, RCentral tiene:\n```\nip route 192.168.90.64 255.255.255.224 serial 0/0/0\n```\n¿Qué hosts abarca esa ruta?", "192.168.90.65 a 192.168.90.94 (la subred 192.168.90.64/27).", "192.168.90.65 a 192.168.90.126 (la subred 192.168.90.64/26).", "192.168.90.64 a 192.168.90.95, incluidas red y broadcast como hosts.", "Solo el host 192.168.90.64.", "255.255.255.224 es /27: 30 hosts útiles."], ["Un router tiene:\n```\nip route 192.168.90.144 255.255.255.240 serial 0/1/0\n```\n¿Qué red de destino y cuántos hosts útiles abarca?", "192.168.90.144/28 con 14 hosts útiles.", "192.168.90.144/27 con 30 hosts útiles.", "192.168.90.144/29 con 6 hosts útiles.", "192.168.90.144/28 con 16 hosts útiles.", "255.255.255.240 es /28: 2⁴ − 2 = 14 hosts."], ["¿Qué distancia administrativa tienen por defecto las rutas estáticas y las de RIP?", "Estática 1 y RIP 120.", "Estática 120 y RIP 1.", "Estática 0 y RIP 110.", "Estática 1 y RIP 110.", "Gana la fuente de menor distancia administrativa; OSPF es 110."], ["Un router aprende la red 10.1.0.0/16 por RIP y también tiene una ruta estática a la misma red. ¿Cuál instala en la tabla?", "La estática, porque su distancia administrativa (1) es menor que la de RIP (120).", "La de RIP, porque su métrica es menor.", "Las dos, repartiendo la carga.", "Ninguna, porque hay conflicto.", "La distancia administrativa se compara antes que la métrica."], ["En una tabla de rutas aparece:\n```\nR 192.168.5.0/24 [120/2] via 192.168.2.2, 00:00:23, Serial0/0/0\n```\n¿Qué significa el 2?", "La métrica: dos saltos hasta la red de destino.", "La distancia administrativa de la ruta.", "El número de interfaz de salida.", "El tiempo en segundos desde la actualización.", "120 es la distancia administrativa y R indica que se aprendió por RIP."], ["En esa misma línea, ¿qué significa 00:00:23?", "El tiempo transcurrido desde la última actualización de esa ruta.", "La métrica de la ruta en horas, minutos y segundos.", "El tiempo de vida del paquete.", "El temporizador de las actualizaciones de 30 segundos.", "via 192.168.2.2 es el siguiente salto."], ["Un router tiene en su tabla una ruta marcada con C. ¿De qué tipo es?", "Una red conectada directamente a una de sus interfaces.", "Una ruta aprendida por RIP.", "Una ruta estática.", "Una ruta por defecto.", "Las redes conectadas se cargan solas al configurar IP y máscara en una interfaz activa."], ["¿Cómo se habilita RIP en un router con las redes 192.168.1.0/24 y 10.0.0.0/8 conectadas?", "router rip\nnetwork 192.168.1.0\nnetwork 10.0.0.0", "router rip\nnetwork 192.168.1.0 255.255.255.0\nnetwork 10.0.0.0 255.0.0.0", "router rip\nnetwork 192.168.1.1\nnetwork 10.0.0.1", "rip enable\nnetwork 192.168.1.0/24\nnetwork 10.0.0.0/8", "RIPv1 trabaja con redes con clase: se declara la red principal, sin máscara."], ["Una LAN conectada a Fa0/0 no debe recibir actualizaciones RIP. ¿Qué comando corresponde dentro de router rip?", "passive-interface fa0/0", "no network fa0/0", "default-information originate", "no auto-summary fa0/0", "Evita enviar actualizaciones por esa interfaz."], ["¿Qué comando se usa en el router de borde hacia el ISP para propagar una ruta por defecto por RIP?", "default-information originate", "ip default-network 0.0.0.0", "network 0.0.0.0", "redistribute default", "La ruta se crea antes con ip route 0.0.0.0 0.0.0.0 s0/0/1."], ["En los demás routers, la ruta por defecto aprendida por RIP aparece en la tabla como:", "R*", "S*", "C*", "O*", "R indica RIP; el asterisco marca la candidata a ruta por defecto."], ["Un router RIP envía una actualización por una interfaz. Según el horizonte dividido, ¿qué rutas omite?", "Las que aprendió por esa misma interfaz.", "Las redes conectadas directamente.", "Las rutas con más de 5 saltos.", "Las rutas estáticas.", "Evita los bucles de enrutamiento entre vecinos."], ["¿Cuál es el máximo de saltos válido en RIP y qué pasa con el siguiente?", "15 saltos; 16 se considera inalcanzable (infinito).", "16 saltos; 17 se considera inalcanzable.", "255 saltos; 256 se considera inalcanzable.", "30 saltos; 31 se considera inalcanzable.", "Por eso RIP solo sirve para redes de tamaño limitado."], ["¿Cada cuánto tiempo envía RIPv1 sus actualizaciones y a qué puerto?", "Cada 30 segundos, por broadcast, con UDP puerto 520.", "Cada 60 segundos, por multicast, con TCP puerto 520.", "Cada 30 segundos, por unicast, con TCP puerto 179.", "Cada 90 segundos, por broadcast, con UDP puerto 53.", "Envía la tabla completa en cada actualización."], ["¿Por qué RIPv1 no soporta VLSM?", "Porque no envía la máscara de subred en las actualizaciones.", "Porque limita las redes a 15 saltos.", "Porque usa solo UDP.", "Porque la distancia administrativa es 120.", "Tampoco soporta redes no contiguas."], ["Un router tiene la ruta ip route 192.168.3.0 255.255.255.0 Serial0/0/0 y la interfaz Serial0/0/0 está caída. ¿Qué ocurre con esa ruta?", "Se quita de la tabla de enrutamiento, porque la interfaz de salida no está activa.", "Se mantiene y los paquetes se descartan sin aviso.", "Se cambia sola por una ruta RIP.", "Se mantiene y se envía por Serial0/0/1.", "Una ruta estática con interfaz de salida depende de que esa interfaz esté up/up."], ["¿Qué comando muestra los temporizadores, las redes y las fuentes de información de RIP?", "show ip protocols", "show ip route rip", "debug ip rip", "show running-config interface", "debug ip rip muestra las actualizaciones en tiempo real."]]}, "VIII": {"title": "Subredes y VLSM: ejercicios", "qs": [["Se divide 192.168.90.0/24 en 4 subredes iguales. ¿Cuál es la máscara y cuál es la tercera subred con su rango de hosts?", "255.255.255.192 (/26); tercera: 192.168.90.128/26, hosts .129 a .190, broadcast .191.", "255.255.255.224 (/27); tercera: 192.168.90.64/27, hosts .65 a .94, broadcast .95.", "255.255.255.192 (/26); tercera: 192.168.90.128/26, hosts .128 a .191.", "255.255.255.128 (/25); tercera: 192.168.90.0/25, hosts .1 a .126.", "2 bits prestados: 4 subredes con salto 64."], ["La subred 192.168.90.64/26 se divide en dos /27. ¿Cuál es la segunda y su rango?", "192.168.90.96/27; hosts .97 a .126; broadcast .127.", "192.168.90.64/27; hosts .65 a .94; broadcast .95.", "192.168.90.96/27; hosts .96 a .127; broadcast .128.", "192.168.90.95/27; hosts .96 a .125; broadcast .126.", "Salto de 32: .64 y .96."], ["La subred 192.168.90.128/26 se divide en cuatro /28. ¿Cuál es la segunda y cuántos hosts útiles tiene?", "192.168.90.144/28 con 14 hosts útiles (.145 a .158).", "192.168.90.144/28 con 16 hosts útiles (.144 a .159).", "192.168.90.136/28 con 14 hosts útiles (.137 a .150).", "192.168.90.160/28 con 14 hosts útiles (.161 a .174).", "Salto de 16: .128, .144, .160, .176."], ["La subred 192.168.90.160/28 se divide en cuatro /30 para enlaces WAN. ¿Cuál es la segunda y qué direcciones de host tiene?", "192.168.90.164/30; hosts .165 y .166; broadcast .167.", "192.168.90.162/30; hosts .163 y .164; broadcast .165.", "192.168.90.164/30; hosts .164 y .165; broadcast .166.", "192.168.90.168/30; hosts .169 y .170; broadcast .171.", "Salto de 4: .160, .164, .168, .172."], ["¿Cuál es el último enlace /30 de la subred 192.168.90.160/28 y cuál es su broadcast?", "192.168.90.172/30; broadcast 192.168.90.175.", "192.168.90.172/30; broadcast 192.168.90.174.", "192.168.90.176/30; broadcast 192.168.90.179.", "192.168.90.170/30; broadcast 192.168.90.173.", "El broadcast del último /30 coincide con el del /28 completo (.175)."], ["Un router tiene en su LAN la interfaz 192.168.1.190 con máscara 255.255.255.224. ¿Qué rol cumple esa dirección en la subred?", "Es la última dirección de host de la red 192.168.1.160/27, usada como gateway.", "Es la dirección de red de la subred 192.168.1.160/27.", "Es el broadcast de la subred 192.168.1.160/27.", "Pertenece a la subred 192.168.1.128/27.", "La red es .160, los hosts van de .161 a .190 y el broadcast es .191."], ["Un router tiene la interfaz 192.168.1.126 con máscara 255.255.255.192. ¿A qué red pertenece y cuál es su broadcast?", "Red 192.168.1.64/26; broadcast 192.168.1.127.", "Red 192.168.1.0/26; broadcast 192.168.1.63.", "Red 192.168.1.64/26; broadcast 192.168.1.126.", "Red 192.168.1.96/26; broadcast 192.168.1.127.", "/26 tiene salto 64: .0, .64, .128, .192."], ["Un servidor web tiene IP 192.168.1.65, máscara 255.255.255.224 y gateway 192.168.1.94. ¿Es correcta la configuración?", "Sí: el gateway es la última dirección de host de la subred 192.168.1.64/27.", "No: el gateway es la dirección de broadcast de la subred.", "No: el gateway pertenece a otra subred.", "No: 192.168.1.65 es la dirección de red.", "192.168.1.64/27 tiene hosts de .65 a .94 y broadcast .95."], ["Una PC tiene IP 192.168.1.1, máscara 255.255.255.192 y gateway 192.168.1.62. ¿Qué se puede decir?", "Está bien: ambas direcciones pertenecen a la red 192.168.1.0/26.", "El gateway es el broadcast de la subred.", "El gateway está en otra subred.", "La IP es la dirección de red.", "192.168.1.0/26 abarca hosts de .1 a .62, broadcast .63."], ["Una PC tiene IP 192.168.1.161, máscara 255.255.255.224 y gateway 192.168.1.190. ¿A qué red pertenece?", "192.168.1.160/27", "192.168.1.128/27", "192.168.1.0/27", "192.168.1.161/27", "161 AND 224 = 160."], ["En la tabla de direccionamiento de un laboratorio aparece:\n```\nPC3: IP 192.168.20.23/24, gateway 192.168.30.1\n```\n¿Cuál es el problema?", "El gateway está fuera de la subred de la PC: no podrá comunicarse con otras redes.", "La IP es la dirección de broadcast.", "La máscara debería ser /30.", "Falta la dirección de red.", "El gateway debe estar en la misma red que el host."], ["Un departamento necesita 60 hosts y otro 25. Con VLSM sobre 192.168.15.0/24, ¿qué prefijos conviene asignar?", "/26 para 60 hosts (62 útiles) y /27 para 25 hosts (30 útiles).", "/25 para 60 hosts y /26 para 25 hosts.", "/27 para 60 hosts y /28 para 25 hosts.", "/26 para ambos.", "Ordenar de mayor a menor y asignar sin superponer bloques."], ["Con VLSM sobre 192.168.15.0/24, se asigna primero un /26 a la LAN de 58 hosts. ¿Con qué dirección empieza el siguiente bloque libre?", "192.168.15.64", "192.168.15.63", "192.168.15.58", "192.168.15.128", "El /26 ocupa de .0 a .63."], ["¿Cuántos hosts útiles tiene la máscara 255.255.255.248?", "6", "8", "14", "2", "2³ − 2 = 6."], ["¿Cuál es la máscara de la subred 10.0.0.0/22?", "255.255.252.0", "255.255.248.0", "255.255.254.0", "255.255.240.0", "22 bits: 8 + 8 + 6 unos."], ["El host 172.16.132.70/20, ¿a qué red pertenece y cuál es su broadcast?", "Red 172.16.128.0/20; broadcast 172.16.143.255.", "Red 172.16.132.0/20; broadcast 172.16.147.255.", "Red 172.16.128.0/20; broadcast 172.16.135.255.", "Red 172.16.132.64/20; broadcast 172.16.132.127.", "132 AND 240 = 128; el salto es 16 en el tercer octeto."], ["Un host con IP 192.168.1.130/26 envía un paquete a 192.168.1.60. ¿Qué hace el host?", "Lo envía a su gateway, porque el destino está en otra subred.", "Lo entrega directamente por ARP al destino.", "Lo descarta.", "Lo envía a la dirección de broadcast.", "130 está en la red .128/26 y 60 en la .0/26."]]}, "IX": {"title": "VLAN, troncales y router-on-a-stick: configuración", "qs": [["Se necesita crear la VLAN 20 con el nombre Estudiante en un switch. ¿Qué secuencia es correcta?", "vlan 20\nname Estudiante", "interface vlan 20\nname Estudiante", "vlan 20 name Estudiante\nactivate", "switchport vlan 20\nname Estudiante", "Se hace desde el modo de configuración global."], ["Se asigna el rango de puertos Fa0/11 a Fa0/17 a la VLAN 10 de acceso. ¿Qué configuración es correcta?", "interface range fastEthernet 0/11-17\nswitchport mode access\nswitchport access vlan 10", "interface range fastEthernet 0/11-17\nswitchport mode trunk\nswitchport access vlan 10", "interface fastEthernet 0/11\nswitchport access vlan 10 range 17", "vlan 10\ninterface range fastEthernet 0/11-17", "Un puerto de acceso estático pertenece a una sola VLAN."], ["Se configuran las interfaces Fa0/1 a Fa0/5 de un switch como troncales:\n```\ninterface range fastEthernet 0/1-5\nswitchport mode trunk\nswitchport trunk native vlan 56\nswitchport trunk allowed vlan 10,20,30,56\n```\n¿Qué efecto tiene la última línea?", "Solo las VLAN 10, 20, 30 y 56 pueden cruzar el troncal.", "Crea las VLAN 10, 20, 30 y 56.", "Asigna los puertos 10, 20, 30 y 56 a la VLAN nativa.", "Prohíbe esas VLAN en el troncal.", "Por defecto un troncal permite todas las VLAN."], ["En el troncal de la pregunta anterior, ¿qué significa native vlan 56?", "El tráfico sin etiquetar que llega por el troncal se asigna a la VLAN 56.", "Todo el tráfico del troncal se etiqueta con la VLAN 56.", "La VLAN 56 queda prohibida en el troncal.", "La VLAN 56 es la única que puede cruzar el troncal.", "La VLAN nativa debe coincidir en ambos extremos."], ["Un switch tiene el puerto Fa0/1 en modo troncal con VLAN nativa 99 y el otro extremo con VLAN nativa 100. ¿Qué ocurre?", "Aparecen mensajes de falta de concordancia de la VLAN nativa y el tráfico no etiquetado se asigna a VLAN distintas.", "Se bloquea el puerto automáticamente.", "Se negocia una VLAN nativa común mediante DTP.", "El troncal funciona, pero solo para la VLAN 1.", "Se corrige configurando la misma VLAN nativa en ambos extremos."], ["Dos switches conectados tienen sus puertos en dynamic auto. ¿Qué pasa?", "No se forma el troncal: ambos esperan que el otro lo pida y quedan en modo acceso.", "Se forma el troncal 802.1Q.", "Se forma el troncal ISL.", "Los puertos se bloquean por STP.", "Hay que poner al menos uno en trunk o dynamic desirable."], ["¿Qué comando muestra los troncales, la VLAN nativa y las VLAN permitidas de un switch?", "show interfaces trunk", "show vlan brief", "show ip interface brief", "show mac address-table", "show vlan brief muestra las VLAN y sus puertos de acceso."], ["Se creó la VLAN 30 pero los hosts no se comunican entre switches. show interfaces trunk muestra Vlans allowed: 10,20,56. ¿Cuál es la solución?", "switchport trunk allowed vlan add 30", "switchport mode access vlan 30", "vlan 30 trunk", "switchport trunk native vlan 30", "La lista de permitidas no se actualizó al crear la VLAN."], ["Un router conecta tres VLAN mediante un único enlace con el switch (router-on-a-stick). ¿Qué configuración corresponde a la VLAN 10 en el router?", "interface FastEthernet0/1.10\nencapsulation dot1Q 10\nip address 172.17.10.1 255.255.255.0", "interface FastEthernet0/1\nencapsulation dot1Q 10\nip address 172.17.10.1 255.255.255.0", "interface Vlan10\nencapsulation dot1Q 10\nip address 172.17.10.1 255.255.255.0", "interface FastEthernet0/1.10\nswitchport access vlan 10\nip address 172.17.10.1 255.255.255.0", "Cada VLAN usa una subinterfaz con su encapsulación y su IP."], ["En un router-on-a-stick, ¿qué dirección usan los hosts de la VLAN 10 como gateway?", "La IP de la subinterfaz del router para la VLAN 10.", "La IP de la interfaz física del router sin subinterfaces.", "La IP de la SVI de administración del switch.", "La dirección de broadcast de la VLAN 10.", "Por ejemplo, 172.17.10.1 para la subred 172.17.10.0/24."], ["El router-on-a-stick tiene configuradas las subinterfaces .10, .20 y .30, pero ninguna funciona. ¿Qué falta con mayor probabilidad?", "no shutdown en la interfaz física.", "switchport mode access en el router.", "Una ruta por defecto en el switch.", "vlan 10 en el router.", "Las subinterfaces dependen de que la interfaz física esté activa."], ["En el lado del switch del enlace hacia el router, ¿cómo debe configurarse el puerto?", "switchport mode trunk\nswitchport trunk allowed vlan 10,20", "switchport mode access\nswitchport access vlan 10", "switchport mode dynamic auto\nswitchport access vlan 20", "no switchport\nip address 192.168.10.1 255.255.255.0", "El router necesita recibir las VLAN etiquetadas con 802.1Q."], ["Dos PC en distintas VLAN conectadas al mismo switch no pueden hacerse ping. ¿Cuál es la explicación?", "Están en subredes distintas y se necesita un router o un switch de capa 3 para enrutar entre VLAN.", "El switch bloquea ICMP entre VLAN por defecto.", "Falta configurar SSH en el switch.", "Los puertos de acceso no permiten ICMP.", "Cada VLAN es una subred IP independiente."], ["Una PC de la VLAN 10 (192.168.10.21/24) se mueve a la VLAN 20, pero no cambia su IP. ¿Qué ocurre?", "No puede comunicarse con la VLAN 20: su IP y gateway pertenecen a la subred de la VLAN 10.", "Funciona automáticamente: el switch cambia la IP.", "Funciona, pero solo con ping.", "Funciona si se cambia la máscara a /16.", "Hay que cambiar la IP a una de la subred de la VLAN 20 (por ejemplo 192.168.20.21)."], ["¿Qué comando devuelve un puerto de acceso a la VLAN 1 sin borrar la VLAN que tenía?", "no switchport access vlan", "no vlan 20", "delete flash:vlan.dat", "switchport mode trunk", "no vlan 20 elimina la VLAN del sistema."], ["La VLAN de administración es la 56 y el switch tiene esta configuración:\n```\ninterface Vlan56\nip address 192.168.56.11 255.255.255.0\nno shutdown\n```\n¿Para qué sirve?", "Para acceder al switch de forma remota (SSH, Telnet) desde la red de administración.", "Para reenviar tramas de la VLAN 56.", "Para crear la VLAN 56 en la base de datos.", "Para configurar el puerto troncal.", "La interfaz VLAN (SVI) da conectividad IP al switch."], ["Un switch de capa 3 debe enrutar entre las VLAN 10 y 20. ¿Qué se configura?", "Una SVI por VLAN (interface vlan 10 / interface vlan 20) con su IP, y habilitar el enrutamiento IP.", "Una subinterfaz con encapsulation dot1Q en cada puerto de acceso.", "Un puerto troncal en cada PC.", "Una VLAN nativa distinta por cada SVI.", "Las SVI actúan como interfaces del router."]]}, "X": {"title": "IPv6: configuración y cálculos", "qs": [["Según la tabla del laboratorio, R1 G0/0 tiene 2001:DB8:ACAD:A::1/64. ¿Qué comandos la configuran?", "interface g0/0\nipv6 address 2001:db8:acad:a::1/64\nno shutdown", "interface g0/0\nip address 2001:db8:acad:a::1/64\nno shutdown", "interface g0/0\nipv6 address 2001:db8:acad:a::1 /64\nshutdown", "interface g0/0\nipv6 unicast-routing 2001:db8:acad:a::1/64", "Se usa ipv6 address sin espacio antes del prefijo."], ["En el laboratorio, PC-A (2001:DB8:ACAD:1::3/64) usa como gateway FE80::1. ¿Qué debe tener configurado el router en la interfaz G0/1?", "ipv6 address FE80::1 link-local", "ipv6 address FE80::1/64", "ipv6 address 2001:db8:acad:1::1 link-local", "ipv6 gateway FE80::1", "La link-local estática se declara con la palabra link-local."], ["R1 tiene G0/0 con 2001:db8:acad:a::1/64 y G0/1 con 2001:db8:acad:1::1/64. ¿Qué se puede afirmar?", "Son dos subredes /64 distintas: ID de subred A y 1.", "Es la misma subred con dos gateways.", "Tienen distinto prefijo de enrutamiento global.", "Las dos interfaces no pueden coexistir en un router.", "El prefijo de enrutamiento 2001:db8:acad es el mismo; cambia el ID de subred."], ["¿Cuál es la dirección multicast de nodo solicitado de 2001:db8:acad:a::1?", "FF02::1:FF00:1", "FF02::1:FF0A:1", "FF02::1:2001:DB8", "FF02::1", "Se toman los últimos 24 bits (00:0001) detrás del prefijo FF02::1:FF00:0/104."], ["¿Cuál es la dirección multicast de nodo solicitado de 2001:db8:acad:1::b (VLAN 1 de S1)?", "FF02::1:FF00:B", "FF02::1:FF0B:0", "FF02::1:FF01:B", "FF02::B", "Los últimos 24 bits son 00:000B."], ["Un router tiene configuradas las interfaces con direcciones IPv6, pero no envía RA. ¿Qué comando falta?", "ipv6 unicast-routing", "ipv6 enable-ra", "ipv6 router rip", "ipv6 address autoconfig", "Habilita el routing IPv6 y hace que el router se una a FF02::2."], ["En show ipv6 interface aparecen los grupos FF02::1 y FF02::2 (además del de nodo solicitado). ¿Qué indica FF02::2?", "Que el router se unió al grupo multicast de todos los routers.", "Que el router es un host IPv6.", "Que la interfaz usa EUI-64.", "Que la interfaz está en modo DHCPv6.", "FF02::1 es el de todos los nodos."], ["Un host IPv6 muestra esta configuración:\n```\nFE80::2AA:FF:FE28:9C5A\n```\n¿Qué se puede deducir?", "Es una link-local cuya ID de interfaz parece generada por EUI-64 (contiene FFFE).", "Es una dirección global.", "Es una dirección multicast.", "Es una dirección de loopback.", "El patrón FF:FE en el medio de la ID de interfaz indica EUI-64."], ["La ID de interfaz 02AA:00FF:FE28:9C5A se generó por EUI-64. ¿Cuál es la MAC original?", "00-AA-00-28-9C-5A", "02-AA-00-28-9C-5A", "00-AA-00-FF-FE-28", "02-AA-00-FF-FE-28", "Se quita FFFE y se invierte el séptimo bit del primer byte: 02 → 00."], ["Con la MAC 00-1A-2B-3C-4D-5E y prefijo 2001:DB8:ACAD:1::/64, ¿cuál es la dirección SLAAC con EUI-64?", "2001:DB8:ACAD:1:21A:2BFF:FE3C:4D5E", "2001:DB8:ACAD:1:1A:2BFF:FE3C:4D5E", "2001:DB8:ACAD:1:21A:2B3C:FFFE:4D5E", "2001:DB8:ACAD:1:01A:2BFF:FE3C:4D5E", "El primer byte 00 pasa a 02: 021A = 21A (sin ceros iniciales)."], ["Una PC con SLAAC recibió un RA con el prefijo 2001:DB8:ACAD:1::/64 y no hay servidor DHCPv6. ¿Qué obtiene del RA?", "Prefijo, longitud de prefijo y gateway (la link-local del router).", "Solo el servidor DNS.", "La dirección completa asignada por el router.", "Solo la máscara decimal.", "La ID de interfaz la genera el propio host."], ["¿Cómo se abrevia 2001:0DB8:0000:0000:0000:0000:0000:0001?", "2001:DB8::1", "2001:DB8:0::1", "2001:DB8::0001", "2001:DB8:::1", "Se omiten ceros iniciales y los hextetos de ceros pasan a ::."], ["¿Cuál de estas direcciones es inválida?", "2001:DB8::1::2", "2001:DB8::1:2", "2001:DB8:0:1::2", "::1", ":: solo puede aparecer una vez en la dirección."], ["Se quiere probar el stack IPv6 del propio host. ¿Qué dirección se usa en el ping?", "ping ::1", "ping ::", "ping FF02::1", "ping FE80::1", "::1 es la dirección de loopback."], ["Desde R1 se prueba un ping a la link-local del vecino:\n```\nR1# ping FE80::2\n```\n¿Qué pide el IOS?", "La interfaz de salida, porque la link-local solo es única en su enlace.", "La contraseña enable.", "El prefijo de la red.", "La dirección MAC del vecino.", "El router puede tener la misma link-local en varias interfaces."], ["Un router muestra con show ipv6 route estas entradas:\n```\nC 2001:DB8:ACAD:A::/64 [0/0]\nL 2001:DB8:ACAD:A::1/128 [0/0]\n```\n¿Qué indica la L?", "Una ruta local /128 hacia la dirección de la propia interfaz.", "Un enlace aprendido por un protocolo de enrutamiento.", "La ruta por defecto.", "Un enlace hacia un vecino link-local.", "C es la red conectada directamente."], ["¿En qué se diferencia el uso de ping entre IPv4 e IPv6 en el laboratorio?", "Se usan los mismos comandos (ping, tracert), pero con direcciones IPv6.", "IPv6 usa el comando ping6 obligatoriamente en IOS.", "Solo IPv4 admite traceroute.", "En IPv6 el ping no usa ICMP.", "ICMPv6 incluye además los mensajes de descubrimiento de vecinos."], ["¿Qué dirección usa un router como destino de un RA?", "FF02::1 (todos los nodos).", "FF02::2 (todos los routers).", "El broadcast de la red.", "::1", "Los RS de los hosts van a FF02::2."]]}, "XI": {"title": "Transporte: Wireshark, nmap, TCP y UDP en la práctica", "qs": [["En una captura de Wireshark, el primer paquete del enlace de tres vías muestra Flags: SYN y Seq = 100. ¿Qué lleva el segundo paquete?", "Flags SYN y ACK, con Ack = 101 y un número de secuencia propio del servidor.", "Flags SYN solamente, con Ack = 100.", "Flags ACK solamente, con Ack = 101.", "Flags SYN y ACK, con Ack = 100.", "El ACK es el número de secuencia del cliente + 1."], ["En el tercer paquete del enlace de tres vías, el servidor había enviado Seq = 4000. ¿Qué lleva el paquete del cliente?", "Flag ACK y Ack = 4001.", "Flag SYN y Ack = 4001.", "Flag ACK y Ack = 4000.", "Flags SYN y ACK y Ack = 4001.", "A partir de acá todos los segmentos llevan el ACK activo."], ["El Frame 34 tiene un número de secuencia de 8161 y un segmento TCP con 1460 bytes de datos. ¿Cuál es el número de secuencia del Frame 35, si envía datos a continuación?", "9621", "8162", "8161", "10.081", "8161 + 1460 = 9621."], ["Un servidor recibe un segmento con Seq = 2001 y 500 bytes de datos, sin pérdidas anteriores. ¿Qué valor de ACK devuelve?", "2501", "2500", "2001", "2502", "El ACK es el próximo byte esperado: 2001 + 500 = 2501."], ["El receptor tiene los bytes 1 a 3000 y 3401 a 3500, y falta el tramo 3001–3400. ¿Qué ACK envía?", "3001", "3501", "3401", "3000", "Solo confirma bytes contiguos."], ["En Wireshark se ve que el cliente envía un ACK cada dos segmentos recibidos. ¿Qué indica?", "Que se pueden confirmar varios segmentos con un único ACK para no saturar de acuses.", "Que se perdió un segmento de cada par.", "Que la ventana es de 2 bytes.", "Que la sesión se está cerrando.", "El ACK confirma todo lo anterior al número indicado."], ["¿Cuál es el tamaño del encabezado TCP sin opciones y qué campo lo indica?", "20 bytes; lo indica el campo de longitud del encabezado (desplazamiento de datos).", "8 bytes; lo indica el campo longitud.", "20 bytes; lo indica el campo checksum.", "40 bytes; lo indica el campo ventana.", "UDP tiene un encabezado de 8 bytes."], ["Una captura muestra un paquete de longitud total 1514 bytes (Ethernet) con encabezados IP de 20 y TCP de 20. ¿Cuántos bytes de datos TCP lleva?", "1460 bytes", "1500 bytes", "1474 bytes", "1480 bytes", "1514 − 14 (Ethernet) − 20 (IP) − 20 (TCP) = 1460."], ["Nmap con el perfil “Ping scan” sobre 192.168.1.* sirve para:", "Descubrir los hosts activos de la LAN sin escanear sus puertos.", "Escanear todos los puertos de un único host.", "Capturar paquetes de la red.", "Cambiar la configuración IP de los hosts.", "El comodín * identifica todos los hosts de la red."], ["En Zenmap, el resultado de un host muestra el puerto 80/tcp open http, el 23/tcp closed telnet y el 135/tcp filtered. ¿Qué significa filtered?", "Que un filtro (por ejemplo un firewall) impide saber si el puerto está abierto o cerrado.", "Que el puerto tiene un servicio activo.", "Que el puerto responde pero sin servicio.", "Que el host no existe.", "Open: hay un servicio escuchando; closed: ningún servicio escucha."], ["¿Cuál es la ventaja de limitar los puertos abiertos de un servidor?", "Se reduce la superficie de ataque: menos servicios expuestos.", "Se aumenta el ancho de banda disponible.", "Se evita la segmentación de los datos.", "Se elimina la necesidad de firewall.", "Un puerto con un servicio activo está “abierto”."], ["¿En qué capa del modelo se hace referencia a cada PDU? Trama, paquete, segmento (TCP) y bits.", "Trama: capa 2; paquete: capa 3; segmento: capa 4; bits: capa 1.", "Trama: capa 3; paquete: capa 2; segmento: capa 4; bits: capa 1.", "Trama: capa 2; paquete: capa 4; segmento: capa 3; bits: capa 1.", "Trama: capa 1; paquete: capa 3; segmento: capa 2; bits: capa 4.", "UDP usa datagramas en la capa 4."], ["En el comando netstat -n, ¿qué hace la opción -n?", "Muestra direcciones y puertos en formato numérico, sin resolver nombres.", "Muestra solo las conexiones nuevas.", "Muestra las estadísticas de la red.", "Muestra los nombres de los procesos.", "Sin -n intenta resolver IP a nombres y puertos a aplicaciones conocidas."], ["Se observa en netstat una conexión TCP desconocida hacia un puerto 4444 desde el host. ¿Qué conviene concluir?", "Puede ser una conexión no descrita o una amenaza: hay que investigar qué proceso la originó.", "Es normal, porque el puerto 4444 es de HTTP.", "Se debe ignorar si la conexión es TCP.", "Indica que el host es un servidor DHCP.", "netstat sirve para detectar conexiones innecesarias o sospechosas."], ["Un cliente abre una sesión web. ¿Qué puertos aparecen en el segmento SYN hacia el servidor?", "Origen: puerto dinámico (por ejemplo 49152); destino: 80.", "Origen: 80; destino: puerto dinámico.", "Origen: 80; destino: 80.", "Origen: 443; destino: 21.", "El puerto de origen es una dirección de retorno."], ["¿Qué muestra la columna de estado de netstat para una conexión TCP ya establecida?", "ESTABLISHED", "LISTENING", "SYN_SENT", "TIME_WAIT", "LISTENING indica un puerto abierto esperando conexiones."], ["Un servidor tiene el puerto TCP 80 en estado LISTENING. ¿Qué significa?", "Que hay un servicio escuchando solicitudes en ese puerto.", "Que hay una sesión cerrada.", "Que el puerto está filtrado.", "Que el servidor ya atiende a un cliente.", "Es el estado de un puerto abierto con un servicio activo."]]}, "XII": {"title": "Aplicación: DHCP, DNS, HTTP, correo y FTP en la práctica", "qs": [["Se configura un router como servidor DHCP:\n```\nip dhcp excluded-address 192.168.1.1 192.168.1.10\nip dhcp pool LAN\n network 192.168.1.0 255.255.255.0\n default-router 192.168.1.1\n dns-server 8.8.8.8\n```\n¿Qué hace la primera línea?", "Evita que el servidor entregue las direcciones de 192.168.1.1 a 192.168.1.10.", "Reserva esas direcciones para el DNS.", "Prohíbe los clientes con direcciones en ese rango.", "Define el rango de direcciones que sí se entregan.", "Se usa para direcciones estáticas como el gateway o servidores."], ["En el pool anterior, ¿para qué sirve default-router 192.168.1.1?", "Para entregar a los clientes el gateway predeterminado.", "Para definir la IP del servidor DHCP.", "Para entregar el servidor DNS a los clientes.", "Para habilitar el enrutamiento IP.", "dns-server entrega la IP del servidor DNS."], ["Una PC con configuración IP automática obtiene 169.254.x.x. ¿Qué indica?", "Que no pudo contactar un servidor DHCP y se autoasignó una dirección link-local.", "Que recibió una dirección pública del ISP.", "Que el servidor DHCP agotó el alquiler.", "Que está usando un DNS erróneo.", "Es la dirección APIPA/link-local del bloque 169.254.0.0/16."], ["Un cliente DHCP está en una LAN y el servidor DHCP en otra, detrás de un router. ¿Qué configuración hace falta en la interfaz del router de la LAN del cliente?", "ip helper-address con la IP del servidor DHCP.", "ip dhcp pool con la red del servidor.", "ip route 0.0.0.0 0.0.0.0 al servidor.", "dns-server con la IP del servidor.", "El DHCPDISCOVER es un broadcast y los routers no lo reenvían sin ayuda."], ["Con ipconfig /release y luego ipconfig /renew en una PC, ¿qué se hace?", "Se libera el alquiler actual y se solicita una nueva configuración al servidor DHCP.", "Se borra el caché DNS y se solicita otra IP.", "Se reinicia la placa de red y se asigna IP estática.", "Se cambia el servidor DNS y se renueva el gateway.", "ipconfig /displaydns muestra el caché DNS."], ["Se ejecuta nslookup www.cisco.com. ¿Qué devuelve?", "El servidor DNS consultado y la dirección IP asociada al nombre.", "La ruta hacia el servidor.", "La lista de puertos abiertos del servidor.", "La dirección MAC del servidor.", "Muestra el servidor DNS predeterminado y la respuesta."], ["Un usuario escribe http://www.google.com/web-server.htm en el navegador. ¿Qué pide el cliente con el GET?", "El archivo web-server.htm al servidor www.google.com.", "La dirección IP de www.google.com.", "El protocolo http.", "La página principal www.google.com.", "Tres partes: esquema, servidor y archivo."], ["En una captura de Wireshark se ve esta línea de solicitud:\n```\nGET /index.html HTTP/1.1\nHost: www.ejemplo.com\nAccept-Language: es-ar\n```\n¿Qué indica Accept-Language?", "El idioma preferido por el cliente para la respuesta.", "El lenguaje del servidor web.", "El idioma del sistema operativo del servidor.", "La versión del protocolo HTTP.", "La versión del protocolo es HTTP/1.1."], ["En Wireshark, un cliente envía un HTTP GET y el servidor responde HTTP/1.1 404 Not Found. ¿Qué significa?", "El servidor no encontró el recurso solicitado.", "La solicitud se procesó correctamente.", "El servidor requiere autenticación.", "El servidor está sobrecargado.", "200 OK indica que la solicitud tuvo éxito."], ["¿Qué se observa en una captura Wireshark antes del primer GET de una página web?", "La resolución DNS del nombre y el enlace de tres vías TCP hacia el puerto 80.", "Un DHCPDISCOVER y un ARP del servidor.", "Un FIN del servidor.", "La respuesta HTTP/1.1 200 OK.", "Primero se resuelve la IP y se establece la sesión TCP."], ["Un cliente envía este diálogo SMTP:\n```\nHELO cliente.com\nMAIL FROM:<ana@x.com>\nRCPT TO:<luis@y.com>\nDATA\n```\n¿Qué indica RCPT TO?", "El destinatario del mensaje.", "El emisor del mensaje.", "El comienzo del cuerpo del mensaje.", "La identificación del cliente.", "MAIL FROM indica el emisor y DATA inicia el cuerpo."], ["En una práctica, un cliente de correo puede enviar con SMTP pero no recibe. Se configura POP3 y el puerto 110. ¿Qué dato falta con mayor probabilidad?", "El servidor de correo entrante (POP3) y las credenciales del buzón.", "El servidor DHCP.", "El servidor FTP.", "El puerto UDP 53.", "Para recibir se usa POP3 (o IMAP); para enviar, SMTP."], ["Un cliente FTP envía por la conexión de control el comando PORT. ¿Qué indica?", "El cliente informa el puerto donde espera la conexión de datos (modo activo).", "El cliente pide al servidor que elija el puerto de datos (modo pasivo).", "El cliente cierra la conexión de datos.", "El cliente se autentica con el servidor.", "En modo pasivo se usa PASV."], ["Un cliente FTP detrás de un firewall no logra transferir datos aunque inicia sesión bien. ¿Qué conviene probar?", "Cambiar a modo pasivo.", "Cambiar a modo UDP.", "Cambiar el puerto de control al 20.", "Reemplazar FTP por DHCP.", "En modo pasivo el cliente abre la conexión de datos hacia el servidor."], ["En un servidor DNS se carga el registro:\n```\nmail.ejemplo.com MX 10 srv1.ejemplo.com\n```\n¿Para qué sirve?", "Indica el servidor de correo que recibe el correo del dominio.", "Indica la IP del servidor web.", "Crea un alias del dominio.", "Indica el servidor DNS autoritativo.", "El tipo A asocia un nombre a una IP; CNAME crea un alias."], ["Un servidor tiene IP 192.168.1.65 con los servicios web (80) y DNS (53). ¿Cómo distingue los segmentos de cada servicio?", "Por el puerto de destino de cada segmento.", "Por la dirección MAC de origen.", "Por el número de secuencia.", "Por la dirección IP de origen.", "La capa de transporte multiplexa por puertos."], ["En la práctica de HTTP y DNS, el cliente no puede abrir http://www.ejemplo.com pero sí http://192.168.1.65. ¿Qué falla con mayor probabilidad?", "La resolución DNS (servidor DNS o su configuración en el cliente).", "El servidor web.", "El gateway predeterminado.", "La máscara de subred.", "Si la IP funciona, la conectividad y el servicio web están bien."], ["Se configura un servidor Telnet y uno SSH en el mismo equipo. ¿Qué puertos usan por defecto?", "Telnet TCP 23 y SSH TCP 22.", "Telnet TCP 22 y SSH TCP 23.", "Telnet UDP 23 y SSH UDP 22.", "Telnet TCP 25 y SSH TCP 110.", "SSH cifra el tráfico; Telnet lo envía en texto plano."]]}};
const L="abcdefgh";let LS={};try{LS=JSON.parse(localStorage.getItem("redespractica")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("redespractica",JSON.stringify(LS))}catch(e){}};
const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const units=Object.keys(DATA);
const mode=$("#mode");
mode.innerHTML=`<option value="sel">★ Elegir unidades (al azar)</option>`+units.map(u=>`<option value="u:${u}">Unidad ${u} – ${DATA[u].title}</option>`).join("")+`<option value="mix">Mixto (30 al azar)</option><option value="all">Todas las unidades (en orden)</option>`;
let cur=[],answered=0,right=0,key="";
const SK="redespracticasel";let SEL=[];try{SEL=JSON.parse(localStorage.getItem(SK)||"[]")}catch(e){}
$("#chks").innerHTML=units.map(u=>`<label class="chk"><input type="checkbox" value="${u}"><span>Unidad ${u} – ${esc(DATA[u].title)} <span class="mu">(${DATA[u].qs.length})</span></span></label>`).join("");
const cbs=[...document.querySelectorAll("#chks input")];cbs.forEach(c=>{c.checked=SEL.includes(c.value);c.onchange=selChg});
function chosen(){return cbs.filter(c=>c.checked).map(c=>c.value)}
function selAll(){const out=[];chosen().forEach(u=>DATA[u].qs.forEach((q,i)=>out.push({id:u+"-"+i,u,q})));return out}
function selChg(){const s=chosen();try{localStorage.setItem(SK,JSON.stringify(s))}catch(e){}const n=selAll().length;$("#sInfo").textContent=s.length?`${s.length} unidad(es) · ${n} preguntas disponibles`:"Ninguna unidad marcada"}
$("#sAll").onclick=()=>{cbs.forEach(c=>c.checked=true);selChg()};
$("#sNone").onclick=()=>{cbs.forEach(c=>c.checked=false);selChg()};
$("#sMax").onclick=()=>{$("#sN").value=Math.max(1,selAll().length)};
function selGo(){const all=selAll();if(!all.length){cur=[];answered=0;right=0;$("#main").innerHTML='<div class="res">Marcá al menos una unidad.</div>';upd();return}
  let n=parseInt($("#sN").value)||30;n=Math.min(Math.max(n,1),all.length);$("#sN").value=n;
  render(shuf(all).slice(0,n));$("#seld").open=false}
$("#sGo").onclick=selGo;selChg();

function pool(m){if(m==="sel")return selAll();
  if(m.startsWith("u:")){const u=m.slice(2);return DATA[u].qs.map((q,i)=>({id:u+"-"+i,u,q}))}
  const all=[];units.forEach(u=>DATA[u].qs.forEach((q,i)=>all.push({id:u+"-"+i,u,q})));
  return m==="mix"?shuf(all).slice(0,30):all;
}
function render(list,onlyWrong){
  cur=list;answered=0;right=0;const main=$("#main");main.innerHTML="";
  if(!list.length){main.innerHTML='<div class="res">No hay preguntas para mostrar.</div>';upd();return}
  list.forEach((it,n)=>{
    const opts=shuf([{t:it.q[1],ok:1},{t:it.q[2]},{t:it.q[3]},{t:it.q[4]}]);
    const d=document.createElement("div");d.className="q";d.id="q"+n;
    d.innerHTML=`<h3><span>${n+1}.</span>${fmt(it.q[0])}</h3>`+opts.map((o,k)=>`<button class="o" data-k="${k}"><b>${L[k]})</b><span>${fmt(o.t)}</span></button>`).join("")+`<div class="fb hide"></div>`;
    d.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(d,it,opts,+b.dataset.k));
    main.appendChild(d);
  });
  const e=document.createElement("div");e.className="res hide";e.id="end";main.appendChild(e);upd();window.scrollTo(0,0);
}
function fmt(s){return s.split('```').map((x,i)=>i%2?'<pre class="cd">'+esc(x.replace(/^\n/,'').replace(/\n$/,''))+'</pre>':esc(x)).join('')}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function pick(d,it,opts,k){
  const bs=d.querySelectorAll(".o");bs.forEach((b,i)=>{b.disabled=true;if(opts[i].ok)b.classList.add("ok")});
  const good=!!opts[k].ok;if(!good)bs[k].classList.add("ko");
  const fb=d.querySelector(".fb");fb.className="fb "+(good?"ok":"ko");
  fb.innerHTML=`<b class="t">${good?"✔ ¡Correcta!":"✘ Incorrecta"}</b>${fmt(it.q[5])}`;
  answered++;if(good)right++;LS[it.id]=good?1:0;save();upd();
  if(answered===cur.length){const e=$("#end");e.classList.remove("hide");const p=Math.round(100*right/cur.length);
    e.innerHTML=`<b>Terminaste: ${right} de ${cur.length} (${p} %).</b><div class="mu">${p>=60?"Buen nivel; repasá las que fallaste con el botón de arriba.":"Conviene repasar el resumen de la unidad y volver a intentar."}</div>`;e.scrollIntoView({behavior:"smooth"})}
}
function upd(){$("#score").textContent=`${right} / ${answered} correctas · ${cur.length} preguntas`;$("#pb").style.width=cur.length?(100*answered/cur.length)+"%":"0"}
function start(){const sel=mode.value==="sel";$("#selbox").classList.toggle("hide",!sel);
  if(sel){if(cur.length&&started)selGo();else{cur=[];answered=0;right=0;$("#main").innerHTML='<div class="res">Marcá las unidades que querés, elegí la cantidad y apretá <b>Empezar</b>.</div>';upd();$("#seld").open=true}started=true;return}
  render(pool(mode.value))}
let started=false;
mode.onchange=start;$("#reset").onclick=start;
$("#wrong").onclick=()=>{if(mode.value==="sel"){render(shuf(selAll().filter(x=>LS[x.id]===0)));return}const base=pool(mode.value.startsWith("u:")?mode.value:"all").filter(x=>LS[x.id]===0);render(shuf(base))};
start();
</script></body></html>
